services:
  vff-remnawave-events:
    image: vff-remnawave-events:local
    container_name: vff-remnawave-events
    restart: unless-stopped
    env_file:
      - /opt/vff-remnawave-events/.env
    volumes:
      - /opt/vff-remnawave-events/data:/data
    networks:
      - remnawave-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  remnawave-network:
    external: true
